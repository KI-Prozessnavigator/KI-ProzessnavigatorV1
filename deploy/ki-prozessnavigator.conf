server {
    listen 80 default_server;
    server_name ki-prozessnavigator.de www.ki-prozessnavigator.de 87.106.166.120;

    root /var/www/html;
    index index.html;

    # Slug-URLs: .html in Adresszeile vermeiden
    # Achtung: KEIN "return 301 /" für /index.html – führt mit try_files zu Redirect-Schleife
    location = /impressum.html { return 301 /impressum; }
    location = /datenschutz.html { return 301 /datenschutz; }
    location = /agb.html { return 301 /agb; }
    location = /ueber-uns.html { return 301 /ueber-uns; }
    location = /impressum   { try_files /impressum.html =404; }
    location = /datenschutz { try_files /datenschutz.html =404; }
    location = /agb        { try_files /agb.html =404; }
    location = /ueber-uns   { try_files /ueber-uns.html =404; }
    location = /vorteile   { try_files /index.html =404; }
    location = /use-cases  { try_files /index.html =404; }
    location = /ablauf     { try_files /index.html =404; }
    location = /dsgvo      { try_files /index.html =404; }
    location = /ersparnis  { try_files /index.html =404; }
    location = /faq        { try_files /index.html =404; }
    location = /kontakt    { try_files /index.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php-fpm/www.sock;
    fastcgi_index index.php;
    }
}

server {
