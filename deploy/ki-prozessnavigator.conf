server {
    listen 80 default_server;
    server_name ki-prozessnavigator.de www.ki-prozessnavigator.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ki-prozessnavigator.de;

    ssl_certificate /etc/letsencrypt/live/ki-prozessnavigator.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki-prozessnavigator.de/privkey.pem;

    return 301 https://ki-prozessnavigator.de$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ki-prozessnavigator.de;

    ssl_certificate /etc/letsencrypt/live/ki-prozessnavigator.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki-prozessnavigator.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.html;

    # SSI for header/footer/cookie-banner includes
    ssi on;

    # ── Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Cache: Static Assets (1 year) ──
    location ~* \.(woff2|woff|ttf|eot|ico|svg|png|jpg|jpeg|webp|gif|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: CSS/JS (1 month) ──
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Trailing slash removal (all pages) ──
    rewrite ^(.+)/$ $1 permanent;

    # ── .html extension removal ──
    if ($request_uri ~ ^(.+)\.html$) {
        return 301 $1;
    }

    # ── API proxy to Node.js backend ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Clean URL resolution ──
    # try_files checks: exact file → directory index → .html extension → 404
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # ── Custom error page ──
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Block dotfiles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Block direct access to includes ──
    location /includes/ {
        deny all;
    }
}
