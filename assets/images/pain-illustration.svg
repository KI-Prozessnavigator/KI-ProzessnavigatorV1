<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <!-- Overflowing Inbox -->
  <g opacity="0.8">
    <rect x="60" y="30" width="200" height="140" rx="12" stroke="#0077FF" stroke-width="1.5" opacity="0.3"/>
    <rect x="70" y="50" width="180" height="24" rx="4" fill="#0077FF" opacity="0.08"/>
    <rect x="70" y="82" width="180" height="24" rx="4" fill="#0077FF" opacity="0.06"/>
    <rect x="70" y="114" width="180" height="24" rx="4" fill="#0077FF" opacity="0.04"/>
    <circle cx="82" cy="62" r="4" fill="#ff5f57"/>
    <circle cx="82" cy="94" r="4" fill="#ff5f57"/>
    <circle cx="82" cy="126" r="4" fill="#febc2e"/>
    <rect x="94" y="58" width="60" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="94" y="90" width="80" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="94" y="122" width="50" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
    <!-- Overflow envelopes -->
    <rect x="50" y="16" width="60" height="36" rx="6" stroke="#0077FF" stroke-width="1" opacity="0.2" transform="rotate(-8 80 34)"/>
    <rect x="200" y="8" width="55" height="32" rx="6" stroke="#0077FF" stroke-width="1" opacity="0.15" transform="rotate(5 228 24)"/>
    <!-- Badge count -->
    <circle cx="252" cy="38" r="14" fill="#ff5f57" opacity="0.9"/>
    <text x="252" y="43" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">47</text>
  </g>

  <!-- Ticking Clock -->
  <g opacity="0.7" transform="translate(40, 200)">
    <circle cx="60" cy="60" r="50" stroke="#00D4FF" stroke-width="1.5" opacity="0.3"/>
    <circle cx="60" cy="60" r="3" fill="#00D4FF" opacity="0.6"/>
    <!-- Hour hand -->
    <line x1="60" y1="60" x2="60" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Minute hand -->
    <line x1="60" y1="60" x2="82" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Tick marks -->
    <line x1="60" y1="14" x2="60" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="60" y1="100" x2="60" y2="106" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="14" y1="60" x2="20" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="100" y1="60" x2="106" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Stress indicator -->
    <text x="60" y="80" font-family="JetBrains Mono, monospace" font-size="9" fill="#ff5f57" text-anchor="middle" opacity="0.7">OVERDUE</text>
  </g>

  <!-- Excel/Spreadsheet -->
  <g opacity="0.6" transform="translate(160, 210)">
    <rect x="0" y="0" width="120" height="90" rx="8" stroke="#0077FF" stroke-width="1.5" opacity="0.25"/>
    <!-- Grid lines -->
    <line x1="40" y1="0" x2="40" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="22" x2="120" y2="22" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="44" x2="120" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="66" x2="120" y2="66" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Header row -->
    <rect x="2" y="2" width="36" height="18" rx="2" fill="#0077FF" opacity="0.15"/>
    <rect x="42" y="2" width="36" height="18" rx="2" fill="#0077FF" opacity="0.15"/>
    <rect x="82" y="2" width="36" height="18" rx="2" fill="#0077FF" opacity="0.15"/>
    <!-- Data cells -->
    <rect x="6" y="27" width="28" height="6" rx="1" fill="rgba(255,255,255,0.1)"/>
    <rect x="46" y="27" width="20" height="6" rx="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="86" y="27" width="24" height="6" rx="1" fill="#ff5f57" opacity="0.3"/>
    <rect x="6" y="49" width="24" height="6" rx="1" fill="rgba(255,255,255,0.1)"/>
    <rect x="46" y="49" width="28" height="6" rx="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="86" y="49" width="18" height="6" rx="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="6" y="71" width="20" height="6" rx="1" fill="rgba(255,255,255,0.1)"/>
    <rect x="46" y="71" width="32" height="6" rx="1" fill="#febc2e" opacity="0.3"/>
    <rect x="86" y="71" width="22" height="6" rx="1" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Connecting chaos lines -->
  <path d="M160 170 Q 200 185 140 210" stroke="#0077FF" stroke-width="0.8" opacity="0.15" stroke-dasharray="4 4"/>
  <path d="M260 170 Q 240 190 270 220" stroke="#00D4FF" stroke-width="0.8" opacity="0.12" stroke-dasharray="4 4"/>
  <path d="M100 310 Q 160 320 170 300" stroke="#0077FF" stroke-width="0.8" opacity="0.1" stroke-dasharray="4 4"/>

  <!-- Floating warning icons -->
  <g opacity="0.5">
    <circle cx="30" cy="160" r="8" fill="none" stroke="#febc2e" stroke-width="1"/>
    <text x="30" y="164" font-family="Inter, sans-serif" font-size="10" fill="#febc2e" text-anchor="middle" font-weight="700">!</text>
  </g>
  <g opacity="0.4">
    <circle cx="290" cy="180" r="8" fill="none" stroke="#ff5f57" stroke-width="1"/>
    <text x="290" y="184" font-family="Inter, sans-serif" font-size="10" fill="#ff5f57" text-anchor="middle" font-weight="700">!</text>
  </g>
</svg>
