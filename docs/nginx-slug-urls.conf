# Nginx: Slug-URLs für ki-prozessnavigator.de (ohne .html in der Adresszeile)
# Einbindung: Im server { } Block für ki-prozessnavigator.de einfügen
# (z. B. in /etc/nginx/conf.d/ oder /etc/nginx/sites-available/).
# Danach: nginx -t && systemctl reload nginx

# .html-URLs dauerhaft auf Slugs umleiten
# NICHT: location = /index.html { return 301 /; } – verursacht mit try_files $uri/ /index.html eine Redirect-Schleife
location = /impressum.html { return 301 /impressum; }
location = /datenschutz.html { return 301 /datenschutz; }
location = /agb.html { return 301 /agb; }
location = /ueber-uns.html { return 301 /ueber-uns; }

# Slugs intern auf .html-Dateien abbilden (URL bleibt z. B. /impressum)
location = /impressum   { try_files /impressum.html =404; }
location = /datenschutz { try_files /datenschutz.html =404; }
location = /agb        { try_files /agb.html =404; }
location = /ueber-uns   { try_files /ueber-uns.html =404; }
location = /kontakt    { try_files /index.html =404; }
